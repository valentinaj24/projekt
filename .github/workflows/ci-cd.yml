
name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend and backend
        run: pnpm lint

  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: pnpm db:generate

      - name: Build frontend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: pnpm build

      - name: Prepare production dependencies
        run: |
          pnpm --filter frontend --prod deploy deploy-frontend

      - name: Prepare standalone artifact
        run: |
          set -e

          mkdir -p runtime

          cp -a frontend/.next/standalone/. runtime/

          rm -rf runtime/node_modules
          rm -rf runtime/frontend/node_modules
          rm -rf runtime/backend/node_modules

          mkdir -p runtime/frontend/node_modules
          cp -a deploy-frontend/node_modules/. runtime/frontend/node_modules/

          mkdir -p runtime/frontend/.next/static
          cp -a frontend/.next/static/. runtime/frontend/.next/static/

          if [ -d frontend/public ]; then
            mkdir -p runtime/frontend/public
            cp -a frontend/public/. runtime/frontend/public/
          fi

          test -f runtime/frontend/server.js
          test -f runtime/frontend/node_modules/next/package.json

          tar -czf prvihxi-build.tar.gz -C runtime .

      - name: Verify production artifact
        run: |
          mkdir -p verify-runtime
          tar -xzf prvihxi-build.tar.gz -C verify-runtime

          cd verify-runtime/frontend

          node -e "require('next/dist/server/config.js'); console.log('Next.js dependencies OK')"
          node -e "console.log('Backend:', require.resolve('backend/db'))"
          node -e "console.log('Prisma:', require.resolve('@prisma/client', { paths: [require('path').dirname(require.resolve('backend/db'))] }))"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: prvihxi-build
          path: prvihxi-build.tar.gz
          retention-days: 7
          if-no-files-found: error

  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend tests with coverage
        run: pnpm --filter backend exec vitest run --coverage

      - name: Run frontend tests with coverage
        run: pnpm --filter frontend exec vitest run --coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            backend/coverage/
            frontend/coverage/
          retention-days: 7

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: [lint, build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: prvihxi-build
          path: artifact

      - name: Verify downloaded artifact
        run: |
          test -f artifact/prvihxi-build.tar.gz
          tar -tzf artifact/prvihxi-build.tar.gz > /dev/null

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.deploy
          push: true
          tags: ghcr.io/valentinaj24/prvihxi:latest
