
name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend and backend
        run: pnpm lint

  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: pnpm db:generate

      - name: Build frontend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: pnpm build

      - name: Prepare standalone artifact
        run: |
          set -e

          STANDALONE="frontend/.next/standalone"

          mkdir -p "$STANDALONE/frontend/.next/static"
          cp -R frontend/.next/static/. "$STANDALONE/frontend/.next/static/"

          if [ -d frontend/public ]; then
            mkdir -p "$STANDALONE/frontend/public"
            cp -R frontend/public/. "$STANDALONE/frontend/public/"
          fi

          # Copy pnpm dependency store
          mkdir -p "$STANDALONE/node_modules/.pnpm"
          cp -a node_modules/.pnpm/. "$STANDALONE/node_modules/.pnpm/"

          # Replace backend symlink with directory
          BACKEND_PATH="$STANDALONE/node_modules/.pnpm/node_modules/backend"
          rm -f "$BACKEND_PATH"
          cp -a backend "$BACKEND_PATH"

          # Resolve remaining symlinks into real files
          cp -aL "$STANDALONE/." frontend/.next/standalone-copy/
          rm -rf "$STANDALONE"
          mv frontend/.next/standalone-copy "$STANDALONE"

      - name: Verify standalone dependencies
        run: |
          cd frontend/.next/standalone
          node -e "require('./frontend/node_modules/next/dist/shared/lib/constants.js'); require('./frontend/node_modules/next/dist/server/config.js'); console.log('Next.js dependencies OK')"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: prvihxi-build
          path: frontend/.next/standalone/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend tests with coverage
        run: pnpm --filter backend exec vitest run --coverage

      - name: Run frontend tests with coverage
        run: pnpm --filter frontend exec vitest run --coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            backend/coverage/
            frontend/coverage/
          retention-days: 7

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: [lint, build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: prvihxi-build
          path: artifact

      - name: Verify downloaded artifact
        run: |
          test -f artifact/frontend/server.js
          test -f artifact/frontend/node_modules/next/dist/server/config.js
          node -e "require('./artifact/frontend/node_modules/next/dist/server/config.js'); console.log('Downloaded artifact OK')"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.deploy
          push: true
          tags: ghcr.io/valentinaj24/prvihxi:latest
